name: studio-plane-phase1

services:
  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: postgres -c "max_connections=300"
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - studio_pgdata:/var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - studio_redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - studio_rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    image: minio/minio
    restart: unless-stopped
    command: server /export --console-address ":9090"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - studio_uploads:/export

  migrator:
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - .env
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    volumes:
      - ../../../apps/api:/code

  api:
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - .env
    depends_on:
      migrator:
        condition: service_completed_successfully
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-minio:
        condition: service_started
    ports:
      - "127.0.0.1:8200:8000"
    volumes:
      - ../../../apps/api:/code

  worker:
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    profiles: ["workers"]
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started
    volumes:
      - ../../../apps/api:/code

  beat-worker:
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    profiles: ["workers"]
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started
    volumes:
      - ../../../apps/api:/code

volumes:
  studio_pgdata:
  studio_redisdata:
  studio_rabbitmq_data:
  studio_uploads:
